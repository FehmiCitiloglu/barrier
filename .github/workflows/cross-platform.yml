name: Cross-platform regression and test DMGs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    name: ${{ matrix.os }} ${{ matrix.config }} ${{ matrix.revision }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        config: [Debug, Release]
        revision: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          # Immutable revision before Apple Silicon implementation.
          ref: ${{ matrix.revision == 'baseline' && '653e4badeb88f61de901581667d4465d7b1e2d52' || github.sha }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst-dev libxinerama-dev libxrandr-dev libxi-dev qtdeclarative5-dev libavahi-compat-libdnssd-dev libcurl4-openssl-dev libssl-dev xvfb
      - if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.13.0'
          arch: win64_msvc2017_64
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./azure-pipelines/download_install_bonjour_sdk_like.ps1
          "BONJOUR_SDK_HOME=$pwd/deps/BonjourSDKLike" >> $env:GITHUB_ENV
      - if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBARRIER_BUILD_INSTALLER=OFF
      - if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBARRIER_BUILD_INSTALLER=OFF
      - run: cmake --build build --config ${{ matrix.config }} --parallel 3
      # Explicit executable calls also exercise suites on the unchanged baseline,
      # whose CTest registration omits the core and integration suites.
      - if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          result=0
          build/bin/unittests --gtest_output=xml:core.xml || result=1
          xvfb-run -a build/bin/guiunittests --gtest_output=xml:gui.xml || result=1
          xvfb-run -a build/bin/integtests --gtest_output=xml:integration.xml || result=1
          exit "$result"
      - if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:PATH = "$pwd/ext/openssl/windows/x64/bin;$pwd/deps/BonjourSDKLike/DLL/x64;$env:PATH"
          $result = 0
          foreach ($suite in @('unittests', 'guiunittests', 'integtests')) {
            & "build/bin/${{ matrix.config }}/$suite.exe" "--gtest_output=xml:$suite.xml"
            if ($LASTEXITCODE -ne 0) { $result = 1 }
          }
          exit $result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.config }}-${{ matrix.revision }}
          path: '*.xml'
  macos:
    name: macOS ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            config: Debug
          - os: macos-15
            arch: arm64
            config: Release
          - os: macos-15-intel
            arch: x86_64
            config: Debug
          - os: macos-15-intel
            arch: x86_64
            config: Release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - run: brew install qt@5 openssl@3 pkgconf
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - run: python3 -B dist/macos/test_verify_bundle.py
      - id: build
        run: cmake --build build --target barrier barrierc barriers unittests guiunittests integtests --parallel 3
      - run: ctest --test-dir build --output-on-failure --timeout 180
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cmake --build build --target Barrier_MacOS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.arch }}-${{ matrix.config }}-test-log
          path: build/Testing/Temporary/LastTest.log
      - if: ${{ !cancelled() && matrix.config == 'Release' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-test-dmg
          path: build/bundle/Barrier-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
